<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fan Place - 관리자</title>
    <link rel="icon" th:href="@{/img/PF_Icon.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body data-admin-dashboard="1" class="flexColumn">
    <!-- 토스트 -->
    <div th:replace="commons :: toast"></div>

    <!-- 헤더 -->
    <div th:replace="commons :: adminHaeder"></div>

    <!-- 섹션 -->
    <section class="flexColumn gapSm">
        <!-- 날짜 -->
        <div class="flex gapSm justifyCenter alignCenter">
            <button class="dateBtn" onclick="changeWeek('prev')"> < </button>
            <span class="title1Text bold" id="week"></span>
            <button class="dateBtn" onclick="changeWeek('next')"> > </button>
        </div>

        <!-- 활동 추이 -->
        <div class="flexColumn gapXs">
            <p class="title2Text bold">활동 추이</p>

            <!-- 최근 7일 추이 -->
            <div class="grayCard pdSm flexColumnMov gapXs">
                <p class="title2Text textCenter">
                    <span class="bold">최근 7일 추이</span> <br>
                    글 <span class="bold pointColorText"></span> |
                    댓글 <span class="bold pointColorText"></span> |
                    활성 유저 <span class="bold pointColorText"></span>
                </p>
                <p class="title2Text textCenter">
                    <span class="bold">전주 대비</span> <br>
                    글 <span class="bold pointColorText"></span> |
                    댓글 <span class="bold pointColorText"></span> |
                    활성 유저 <span class="bold pointColorText"></span>
                </p>
            </div>

            <!-- 카드 -->
            <div class="card pdSm flexColumn gapXs" id="activityTable">
                <div class="flex gapXs">
                    <span class="text1 textCenter">날짜</span>
                    <span class="text1 textCenter">글</span>
                    <span class="text1 textCenter">댓글</span>
                    <span class="text1 textCenter">활성 유저</span>
                </div>
            </div>
        </div>

        <!-- 상태 -->
        <div class="widthFull flexColumnMov gapXs">
            <!-- 게시판 상태 -->
            <div class="widthFull flexColumn gapXs">
                <p class="title2Text bold">게시판 상태</p>

                <!-- 카드 -->
                <div class="card pdSm flexColumn gapXs" id="boardStatusTable">
                    <div class="flex gapXs">
                        <span class="text1 textCenter">게시판</span>
                        <span class="text1 textCenter">글</span>
                        <span class="text1 textCenter">댓글</span>
                        <span class="text1 textCenter">댓글/글</span>
                    </div>
                </div>
            </div>

            <!-- 대화 품질 -->
            <div class="widthFull flexColumn gapXs">
                <p class="title2Text bold">대화 품질</p>

                <!-- 카드 -->
                <div class="card pdSm flexColumn gapXs" id="qualityTable">
                    <div class="flex gapXs">
                        <span class="text1 textCenter">게시판</span>
                        <span class="text1 textCenter">댓글 없는 글</span>
                        <span class="text1 textCenter">1인 댓글</span>
                        <span class="text1 textCenter">평균 참여 유저/글</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 유저 행동 이상 -->
        <div class="widthFull flexColumn gapXs">
            <p class="title2Text bold">유저 행동 이상</p>

            <!-- 카드 -->
            <div class="card pdSm flexColumn gapXs">
                <p class="text1">일 10회 이상 글 작성 유저 <span class="bold pointColorText"></span></p>
                <p class="text1">일 50회 이상 댓글 작성 유저 <span class="bold pointColorText"></span></p>
                <p class="text1">상위 1% 활동 점유율 <span class="bold pointColorText"></span></p>
            </div>
        </div>
    </section>

    <!-- 모달 -->
    <div th:replace="commons :: modal"></div>

    <script type="module" th:src="@{/js/script.js}"></script>
</body>
</html>
