<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fan Place - 관리자 - 삭제된 글</title>
    <link rel="icon" th:href="@{/img/PF_Icon.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="flexColumn">
    <!-- 토스트 -->
    <div th:replace="commons :: toast"></div>

    <!-- 헤더 -->
    <div th:replace="commons :: adminHaeder"></div>

    <!-- 섹션 -->
    <section class="flexColumn gapLg">
        <!-- 게시판 이름 -->
        <p class="title1Text bold textCenter">삭제된 글</p>

        <!-- 게시글 목록 -->
        <div class="postListMenu widthFull flexColumn gapSm alignCenter">
            <!-- 목록 -->
            <div class="postList widthFull" id="deletedPostList"></div>

            <!-- 검색 -->
            <form name="deletedPostSearch" class="searchForm flex gapXs">
                <input type="text" name="keyword" placeholder="삭제된 게시글 중 검색" th:if="${univSearch != true}">
                <button type="button" class="btn teal" onclick="searchDeletedPost()">검색</button>
            </form>

            <!-- 페이지 -->
            <div class="pages flex justifyCenter gapXs" id="deletedPostPagination"></div>
        </div>
    </section>

    <!-- 모달 -->
    <div th:replace="commons :: modal"></div>

    <script type="module" th:src="@{/js/script.js}"></script>
</body>
</html>
