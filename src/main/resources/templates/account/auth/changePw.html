<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fan Place - 비밀번호 변경</title>
    <link rel="icon" th:href="@{/img/PF_Icon.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="flexColumn">
    <!-- 토스트 -->
    <div th:replace="commons :: toast"></div>

    <!-- 헤더 -->
    <div th:replace="commons :: mainHeader"></div>

    <!-- 섹션 -->
    <section class="flex justifyCenter alignCenter">
        <!-- 비밀번호 변경 폼 -->
        <form name="changePwForm" class="authForm">
            <p class="formHeader widthFull textCenter">비밀번호 변경</p>
            <!-- 폼 요소 -->
            <div class="formContent widthFull pdMd flexColumn gapSm">
                <input class="pwInput" name="oldPw" type="password" placeholder="기존 PW">
                <input class="pwInput" name="newPw" type="password" placeholder="새 PW">
                <label class="checkbox flex justifyEnd alignCenter gapXs"> <input type="checkbox" onchange="togglePw('changePwForm', this)"> 비밀번호 보기 </label>
                <button type="button" class="btn teal" onclick="changePw()">비밀번호 변경</button>
            </div>
        </form>
    </section>

    <!-- 푸터 -->
    <div th:replace="commons :: footer"></div>

    <!-- 모달 -->
    <div th:replace="commons :: modal"></div>

    <script type="module" th:src="@{/js/script.js}"></script>
</body>
</html>
