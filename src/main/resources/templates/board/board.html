<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Fan Place - ' + ${header.boardName}"></title>
    <link rel="icon" th:href="@{/img/PF_Icon.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="flexColumn">
    <!-- 토스트 -->
    <div th:replace="commons :: toast"></div>

    <!-- 헤더 -->
    <div th:replace="commons :: mainHeader"></div>

    <!-- 섹션 -->
    <section class="flexColumn gapLg" th:attr="data-univ-search=${univSearch}">
        <!-- 게시판 이름 -->
        <p class="title1Text bold textCenter" th:text="${header.boardName}"></p>

        <!-- 카테고리 -->
        <div class="tabs widthFull flex alignCenter gapSm"
        th:if="${univSearch != true}" th:attr="data-board-id=${header.boardId}">
            <a class="tab now text1" data-tab-type="all">전체</a>
            <a class="tab text1" data-tab-type="hot">인기글</a>
            <a class="tab text1" th:each="cat : ${header.categories}" th:text="${cat.categoryName}"
            th:attr="data-tab-type='category', data-category-id=${cat.categoryId}"></a>
        </div>

        <a sec:authorize="isAuthenticated()" class="widthFull btn teal"
        th:if="${canWrite and (!isNotice or #authorization.expression('hasRole(''ADMIN'')'))}"
        th:href="@{/{boardId}/write(boardId=${header.boardId})}">
            글쓰기
        </a>

        <!-- 게시글 목록 -->
        <div class="postListMenu widthFull flexColumn gapSm alignCenter">
            <!-- 게시글 목록 -->
            <div class="postList widthFull" id="postList"></div>

            <!-- 검색 -->
            <form name="search" class="searchForm flex gapXs" th:if="${univSearch != true}">
                <input type="text" name="keyword" placeholder="게시판 내 검색">
                <button type="button" class="btn teal" onclick="searchBoard()">검색</button>
            </form>
            
            <!-- 페이지 -->
            <div class="pages flex justifyCenter gapXs" id="pagination"></div>
        </div>
    </section>

    <!-- 스크롤 내비게이션 -->
    <nav class="scrollNav flexColumn">
        <button class="scrollBtn textBtn background" onclick="scrollCtr('top')">▲</button>
        <a sec:authorize="isAuthenticated()" class="scrollBtn writeBtn textBtn background"
        th:if="${canWrite and (!isNotice or #authorization.expression('hasRole(''ADMIN'')'))}"
        th:href="@{/{boardId}/write(boardId=${header.boardId})}"></a>
        <button class="scrollBtn textBtn background" onclick="scrollCtr('bottom')">▼</button>
    </nav>

    <!-- 푸터 -->
    <div th:replace="commons :: footer"></div>

    <!-- 모달 -->
    <div th:replace="commons :: modal"></div>

    <script type="module" th:src="@{/js/script.js}"></script>
</body>
</html>
