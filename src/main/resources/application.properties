spring.application.name=fanplace

# DB
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# App
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.join-token-minutes=30

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.reset-token-minutes=30
server.servlet.session.timeout=7d
server.servlet.session.cookie.max-age=7d

app.aws.s3.bucket=fanplace-storage
app.aws.s3.region=ap-northeast-2

app.aws.s3.publicBaseUrl=https://fanplace-storage.s3.ap-northeast-2.amazonaws.com

server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.secure=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul