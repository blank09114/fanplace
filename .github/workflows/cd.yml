name: cd

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: ["dev"]

concurrency:
  group: cd-dev
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy on EC2 via SSM (run deploy.sh)
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(
            aws ssm send-command \
              --document-name "AWS-RunShellScript" \
              --targets "Key=instanceIds,Values=${{ secrets.EC2_INSTANCE_ID }}" \
              --comment "Deploying ${{ github.event.workflow_run.head_sha }}" \
              --timeout-seconds 600 \
              --parameters commands="export GHCR_USER=${{ secrets.GHCR_USER }}; export GHCR_TOKEN=${{ secrets.GHCR_TOKEN }}; cd /home/ec2-user/app && ./deploy.sh" \
              --query "Command.CommandId" \
              --output text
          )

          echo "SSM CommandId: ${COMMAND_ID}"

          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          echo "SSM Status: ${STATUS}"

          # 출력 로그도 같이 찍어주기(디버깅용)
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text || true

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardErrorContent" \
            --output text || true

          if [[ "${STATUS}" != "Success" ]]; then
            echo "Deploy failed (SSM Status=${STATUS})"
            exit 1
          fi